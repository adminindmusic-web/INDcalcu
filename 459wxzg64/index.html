<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080d19">
  <title>INDcalcu — Kalkulator Ilmiah</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="intro-active">
  <section class="lamp-intro" id="lampIntro" aria-label="Nyalakan kalkulator dengan menarik tali lampu">
    <div class="lamp-scene">
      <svg class="lamp-art" viewBox="0 0 300 420" role="img" aria-label="Lampu gantung dengan tali penarik">
        <defs>
          <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#48515a" />
            <stop offset=".48" stop-color="#242b32" />
            <stop offset="1" stop-color="#11151b" />
          </linearGradient>
          <linearGradient id="innerShade" x1="0" y1="0" x2="0" y2="1">
            <stop stop-color="#303841" />
            <stop offset="1" stop-color="#10141a" />
          </linearGradient>
          <radialGradient id="bulbGlow">
            <stop stop-color="#fff6c8" stop-opacity=".95" />
            <stop offset=".35" stop-color="#ffd86a" stop-opacity=".38" />
            <stop offset="1" stop-color="#ffd86a" stop-opacity="0" />
          </radialGradient>
          <filter id="softGlow" x="-150%" y="-150%" width="400%" height="400%">
            <feGaussianBlur stdDeviation="13" />
          </filter>
        </defs>
        <ellipse class="lamp-floor-shadow" cx="151" cy="375" rx="79" ry="13" />
        <ellipse class="lamp-light-pool" cx="151" cy="367" rx="72" ry="9" />
        <path class="lamp-wire" d="M149 0v76" />
        <path class="lamp-shade" d="M89 115c2-37 26-68 61-68s59 31 61 68l27 61c-30 19-146 19-176 0z" />
        <path class="lamp-rim" d="M62 176c25 23 151 23 176 0" />
        <ellipse class="lamp-interior" cx="150" cy="174" rx="87" ry="18" />
        <ellipse class="lamp-bulb-glow" cx="150" cy="181" rx="51" ry="45" />
        <path class="lamp-bulb" d="M139 177c0-10 5-17 11-17s11 7 11 17c0 7-3 10-6 13h-10c-3-3-6-6-6-13z" />
        <path class="lamp-bulb-base" d="M144 191h12m-10 4h8" />
        <path class="pull-cord" d="M151 183c13 49 25 112 42 160" />
        <circle class="pull-knot" cx="193" cy="348" r="10" />
        <path class="pull-knot-detail" d="M189 345h8l-4 10z" />
      </svg>
      <button class="lamp-pull" id="lampPull" type="button" aria-label="Tarik tali untuk menyalakan lampu dan membuka kalkulator"></button>
      <p class="lamp-instruction">Tarik tali untuk menyalakan</p>
      <div class="lamp-loading" id="lampLoading" role="status" aria-live="polite" aria-hidden="true">
        <span class="loading-spinner" aria-hidden="true">
          <i style="--angle: 0deg; --delay: 0s"></i>
          <i style="--angle: 45deg; --delay: -.125s"></i>
          <i style="--angle: 90deg; --delay: -.25s"></i>
          <i style="--angle: 135deg; --delay: -.375s"></i>
          <i style="--angle: 180deg; --delay: -.5s"></i>
          <i style="--angle: 225deg; --delay: -.625s"></i>
          <i style="--angle: 270deg; --delay: -.75s"></i>
          <i style="--angle: 315deg; --delay: -.875s"></i>
        </span>
        <span>Menyiapkan kalkulator</span>
      </div>
    </div>
  </section>
  <main class="page-shell" aria-hidden="true">
    <header class="topbar">
      <a class="brand" href="#" aria-label="INDcalcu kalkulator">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 64 64" role="presentation">
            <circle class="logo-face" cx="32" cy="32" r="29" />
            <circle class="logo-eye" cx="25" cy="32" r="6" />
            <circle class="logo-eye" cx="39" cy="32" r="6" />
            <circle class="logo-pupil" cx="25" cy="32" r="2.5" />
            <circle class="logo-pupil" cx="39" cy="32" r="2.5" />
          </svg>
        </span>
        <span>INDcalcu</span>
      </a>
      <span class="topbar-label">SCIENTIFIC CALCULATOR</span>
      <span class="status"><span class="status-dot"></span> SIAP DIGUNAKAN</span>
    </header>

    <section class="calculator" aria-label="Kalkulator ilmiah">
      <div class="calculator-heading">
        <div>
          <p class="eyebrow">KALKULATOR ILMIAH</p>
          <h1>Hitung apa saja<span>.</span></h1>
        </div>
        <button class="angle-toggle" id="angleToggle" type="button" aria-label="Ubah mode sudut">
          <span class="angle-icon">∠</span><span id="angleMode">DEG</span>
        </button>
      </div>

      <div class="display" aria-live="polite">
        <div class="display-meta"><span>EKSPRESI</span><span class="memory-indicator" id="memoryIndicator">● MEM</span></div>
        <div class="expression" id="expression">0</div>
        <div class="result-row"><span class="result-equals">=</span><output id="result">0</output></div>
      </div>

      <div class="keypad">
        <div class="scientific-grid" aria-label="Fungsi ilmiah">
          <button class="key scientific" data-insert="^-1" aria-label="Kebalikan">x⁻¹</button>
          <button class="key scientific" data-insert="nCr(" aria-label="Kombinasi n pilih r">nCr</button>
          <button class="key scientific" data-insert="Pol(" aria-label="Konversi polar ke koordinat x">Pol</button>
          <button class="key scientific" data-insert="^3" aria-label="Pangkat tiga">x³</button>
          <button class="key scientific" data-insert="frac(" aria-label="Pecahan">a b/c</button>
          <button class="key scientific" data-insert="sqrt(" aria-label="Akar kuadrat">√x</button>
          <button class="key scientific" data-insert="^2" aria-label="Kuadrat">x²</button>
          <button class="key scientific" data-insert="^" aria-label="Pangkat">xʸ</button>
          <button class="key scientific" data-insert="log(" aria-label="Logaritma basis 10">log</button>
          <button class="key scientific" data-insert="ln(" aria-label="Logaritma natural">ln</button>
          <button class="key scientific" data-insert="abs(" aria-label="Nilai absolut">abs</button>
          <button class="key scientific" data-insert="pi" aria-label="Pi">π</button>
          <button class="key scientific" data-insert="-" aria-label="Tanda negatif">(−)</button>
          <button class="key scientific" data-insert="dms(" aria-label="Konversi derajat menit detik">DMS</button>
          <button class="key scientific" data-insert="hyp(" aria-label="Hipotenusa">hyp</button>
          <button class="key scientific" data-insert="sin(" aria-label="Sinus">sin</button>
          <button class="key scientific" data-insert="cos(" aria-label="Cosinus">cos</button>
          <button class="key scientific" data-insert="tan(" aria-label="Tangen">tan</button>
          <button class="key scientific" data-insert="asin(" aria-label="Invers sinus">sin⁻¹</button>
          <button class="key scientific" data-insert="acos(" aria-label="Invers cosinus">cos⁻¹</button>
          <button class="key scientific" data-insert="atan(" aria-label="Invers tangen">tan⁻¹</button>
          <button class="key scientific" data-action="recall" aria-label="Memanggil memori">RCL</button>
          <button class="key scientific" data-action="eng" aria-label="Notasi teknik">ENG</button>
          <button class="key scientific" data-action="memory-add" aria-label="Tambah ke memori">M+</button>
          <button class="key scientific" data-insert="(" aria-label="Kurung buka">(</button>
          <button class="key scientific" data-insert=")" aria-label="Kurung tutup">)</button>
          <button class="key scientific" data-insert="," aria-label="Pemisah argumen">,</button>
          <button class="key scientific" data-action="answer" aria-label="Jawaban terakhir">Ans</button>
          <button class="key scientific" data-insert="e" aria-label="Eksponen sepuluh">EXP</button>
          <button class="key scientific" data-insert="!" aria-label="Faktorial">n!</button>
        </div>

        <div class="main-grid">
          <button class="key utility clear" data-action="clear">AC</button>
          <button class="key utility" data-action="delete">DEL</button>
          <button class="key utility" data-insert="%">%</button>
          <button class="key operator" data-insert="/">÷</button>

          <button class="key number" data-insert="7">7</button>
          <button class="key number" data-insert="8">8</button>
          <button class="key number" data-insert="9">9</button>
          <button class="key operator" data-insert="*">×</button>

          <button class="key number" data-insert="4">4</button>
          <button class="key number" data-insert="5">5</button>
          <button class="key number" data-insert="6">6</button>
          <button class="key operator" data-insert="-">−</button>

          <button class="key number" data-insert="1">1</button>
          <button class="key number" data-insert="2">2</button>
          <button class="key number" data-insert="3">3</button>
          <button class="key operator" data-insert="+">+</button>

          <button class="key number zero" data-insert="0">0</button>
          <button class="key number" data-insert=".">.</button>
          <button class="key equals" data-action="equals">=</button>
        </div>
      </div>
      <footer class="calculator-footer"><span>⌨</span> Bisa juga menggunakan keyboard</footer>
    </section>
    <div class="ambient-note"><span class="note-line"></span> Presisi untuk setiap perhitungan <span class="note-line"></span></div>
  </main>
  <script src="script.js"></script>
</body>
</html>
